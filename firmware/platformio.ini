# ── PlatformIO — Waveshare ESP32-S3-A7670E-4G ────────────────────
# Board confirmed by esptool: ESP32-S3 QFN56 rev v0.2
#   Embedded PSRAM 8MB (AP_3v3)  ← Octal SPI, NOT quad
#   Flash: 16MB (board traces), 8MB visible to default partition
# ─────────────────────────────────────────────────────────────────

# Default env for `pio run` / `pio device monitor` (no -e needed)
[platformio]
default_envs = waveshare_esp32s3_a7670e_debug

# ── Shared settings ───────────────────────────────────────────────
[common]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino

board_build.mcu           = esp32s3
board_build.f_cpu         = 240000000L
board_upload.flash_size   = 16MB
board_build.partitions    = default_8MB.csv

# Octal PSRAM — required for the embedded 8MB AP_3v3 PSRAM on this chip.
# Do NOT use -mfix-esp32-psram-cache-issue (that is for quad SPI PSRAM only).
board_build.arduino.memory_type = qio_opi

monitor_speed  = 115200
# monitor_port and upload_port are intentionally NOT set here.
# PlatformIO will auto-detect the connected ESP32 on any PC.
# If you have multiple devices, run:
#   pio device list
# then override with:  pio run -t upload --upload-port COMx

lib_deps =
    mandulaj/PZEM-004T-v30 @ ^1.1.2
    adafruit/Adafruit NeoPixel @ ^1.12.3
    adafruit/Adafruit MAX1704X @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.0.0

# ── Release build ────────────────────────────────────────────────
[env:waveshare_esp32s3_a7670e]
extends         = common
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    '-DFIREBASE_WEB_API_KEY="AIzaSyBtGpOwNCicAIl5FUh07nXb39Dh-XPdabE"'

# ── Debug build (default — exception decoder uses this ELF) ──────
[env:waveshare_esp32s3_a7670e_debug]
extends         = common
build_type      = debug
monitor_filters = esp32_exception_decoder, default
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=5
    '-DFIREBASE_WEB_API_KEY="AIzaSyBtGpOwNCicAIl5FUh07nXb39Dh-XPdabE"'
