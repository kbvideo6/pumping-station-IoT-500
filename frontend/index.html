<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pumping Station IoT</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="/logo.png">
  
  <link rel="stylesheet" href="/src/style.css">
  
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- App will mount here. Show a basic loading state initially -->
    <div id="initial-loader" style="height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-base); color: var(--text-primary); font-family: 'Inter', sans-serif;">
      <div style="text-align: center; display: flex; flex-direction: column; align-items: center;">
        <img src="/logo.png" alt="Logo" width="56" height="56" style="margin-bottom: 16px; object-fit: contain;">
        <div style="font-size: 1.25rem; font-weight: 500; letter-spacing: 0.05em; color: var(--accent-500); margin-bottom: 16px;">Pumping Station IoT</div>
        <div class="spinner spinner--lg"></div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
